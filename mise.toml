[tools]
rust = "latest"

[settings]
experimental = true

# Every task body is a single-tool invocation (or `&&` chain) that runs
# unchanged under both `sh` and `cmd`, with `run_windows` overrides where
# shells differ (path separators, file discovery). Same convention as
# .reference/mise.toml. No implementation lives in tasks — they only
# orchestrate per-app toolchains.

# ---------- top-level orchestration ----------

[tasks.build]
description = "Build all apps (cli + gui configure+build)"
depends = ["build:cli", "build:gui"]

[tasks.test]
description = "Test all apps (cli + shared + gui)"
depends = ["test:cli", "test:core", "test:shared", "test:gui"]

[tasks.lint]
description = "Lint all apps"
depends = ["lint:cli", "lint:core", "lint:shared", "lint:gui"]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --manifest-path apps/cli/Cargo.toml && cargo fmt --manifest-path crates/core/Cargo.toml && cargo fmt --manifest-path crates/storey-shared/Cargo.toml && cargo fmt --manifest-path apps/gui/Cargo.toml"
run_windows = "cargo fmt --manifest-path apps\\cli\\Cargo.toml && cargo fmt --manifest-path crates\\core\\Cargo.toml && cargo fmt --manifest-path crates\\storey-shared\\Cargo.toml && cargo fmt --manifest-path apps\\gui\\Cargo.toml"

[tasks.clean]
description = "Remove build outputs"
run = "rm -rf build dist apps/cli/target crates/storey-shared/target crates/core/target apps/gui/target"
run_windows = "if exist build rmdir /s /q build & if exist dist rmdir /s /q dist"

[tasks.dev]
description = "Print dev entrypoints"
run = "echo \"cli: mise run dev:cli | gui: mise run dev:gui\""

# ---------- cli (Rust binary over core) ----------

[tasks."build:cli"]
description = "Build storey CLI with cargo, staged at bin/storey like before"
run = "cargo build --manifest-path apps/cli/Cargo.toml && mkdir -p apps/cli/bin && cp apps/cli/target/debug/storey apps/cli/bin/storey"
run_windows = "cargo build --manifest-path apps\\cli\\Cargo.toml && if not exist apps\\cli\\bin mkdir apps\\cli\\bin && copy apps\\cli\\target\\debug\\storey.exe apps\\cli\\bin\\storey.exe"

[tasks."test:cli"]
description = "Test storey CLI with cargo"
run = "cargo test --manifest-path apps/cli/Cargo.toml"
run_windows = "cargo test --manifest-path apps\\cli\\Cargo.toml"

[tasks."lint:cli"]
description = "cargo fmt check + clippy for the CLI"
run = "cargo fmt --manifest-path apps/cli/Cargo.toml -- --check && cargo clippy --manifest-path apps/cli/Cargo.toml -- -D warnings && sh scripts/check-limits.sh apps/cli"
run_windows = "cargo fmt --manifest-path apps\\cli\\Cargo.toml -- --check && cargo clippy --manifest-path apps\\cli\\Cargo.toml -- -D warnings && sh scripts/check-limits.sh apps/cli"

[tasks."build:cli-release"]
description = "Release build of the CLI (per-OS native)"
run = "cargo build --release --manifest-path apps/cli/Cargo.toml"
run_windows = "cargo build --release --manifest-path apps\\cli\\Cargo.toml"

[tasks."dev:cli"]
description = "Run the CLI from source"
run = "cargo run --manifest-path apps/cli/Cargo.toml -- --help"
run_windows = "cargo run --manifest-path apps\\cli\\Cargo.toml -- --help"

# ---------- crates (Rust libs) ----------

[tasks."test:core"]
description = "Test core with cargo"
run = "cargo test --manifest-path crates/core/Cargo.toml"
run_windows = "cargo test --manifest-path crates\\core\\Cargo.toml"

[tasks."lint:core"]
description = "cargo fmt check + clippy for core"
run = "cargo fmt --manifest-path crates/core/Cargo.toml -- --check && cargo clippy --manifest-path crates/core/Cargo.toml -- -D warnings && sh scripts/check-limits.sh crates/core"
run_windows = "cargo fmt --manifest-path crates\\core\\Cargo.toml -- --check && cargo clippy --manifest-path crates\\core\\Cargo.toml -- -D warnings && sh scripts/check-limits.sh crates/core"

# ---------- shared (Rust lib, GUI common layer) ----------

[tasks."test:shared"]
description = "Test storey-shared with cargo"
run = "cargo test --manifest-path crates/storey-shared/Cargo.toml"
run_windows = "cargo test --manifest-path crates\\storey-shared\\Cargo.toml"

[tasks."lint:shared"]
description = "cargo fmt check + clippy for storey-shared"
run = "cargo fmt --manifest-path crates/storey-shared/Cargo.toml -- --check && cargo clippy --manifest-path crates/storey-shared/Cargo.toml -- -D warnings && sh scripts/check-limits.sh crates/storey-shared"
run_windows = "cargo fmt --manifest-path crates\\storey-shared\\Cargo.toml -- --check && cargo clippy --manifest-path crates\\storey-shared\\Cargo.toml -- -D warnings && sh scripts/check-limits.sh crates/storey-shared"

# ---------- gui (Rust / cxx-qt + Qt6) ----------

[tasks."build:gui"]
description = "Build storey-gui with cargo (requires system Qt6)"
run = "cargo build --manifest-path apps/gui/Cargo.toml"
run_windows = "cargo build --manifest-path apps\\gui\\Cargo.toml"

[tasks."build:gui-release"]
description = "Release build of storey-gui (requires system Qt6)"
run = "cargo build --release --manifest-path apps/gui/Cargo.toml"
run_windows = "cargo build --release --manifest-path apps\\gui\\Cargo.toml"

[tasks."test:gui"]
description = "Test storey-gui with cargo"
run = "cargo test --manifest-path apps/gui/Cargo.toml"
run_windows = "cargo test --manifest-path apps\\gui\\Cargo.toml"

[tasks."lint:gui"]
description = "cargo fmt check + clippy for the GUI"
run = "cargo fmt --manifest-path apps/gui/Cargo.toml -- --check && cargo clippy --manifest-path apps/gui/Cargo.toml -- -D warnings && sh scripts/check-limits.sh apps/gui"
run_windows = "cargo fmt --manifest-path apps\\gui\\Cargo.toml -- --check && cargo clippy --manifest-path apps\\gui\\Cargo.toml -- -D warnings && sh scripts/check-limits.sh apps/gui"

[tasks."dev:gui"]
description = "Build the CLI, run the GUI against the fresh binary (needs Qt6 at build time)"
depends = ["build:cli"]
run = "cargo run --manifest-path apps/gui/Cargo.toml -- --storey-bin {{config_root}}/apps/cli/bin/storey"
run_windows = "cargo run --manifest-path apps\\gui\\Cargo.toml -- --storey-bin {{config_root}}/apps/cli/bin/storey.exe"

# ---------- packaging ----------


