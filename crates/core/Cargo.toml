[package]
name = "core"
version = "0.1.0"
edition = "2024"
description = "Storey core library logic: index, hashing, views, adoption (drives the CLI contract)"
license = "MIT"

[lib]
name = "storey_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
