[package]
name = "storey-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Storey core library logic: index, hashing, views, adoption (drives the CLI contract)"

[lib]
name = "storey_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# asm hashing everywhere except Windows: sha2-asm's build script does
# not emit the object MSVC links (LNK1181). Output is identical; only
# speed differs.
[target.'cfg(not(windows))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
