name: release

# Tag vX.Y.Z -> build both apps per OS -> GitHub Release with checksums.
# Patch notes come from CHANGELOG.md via scripts/release-notes.sh.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run build:cli-release
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}
          path: |
            target/release/storey
            target/release/storey.exe

  gui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - run: mise run build:gui-release
      - name: Bundle Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $windeployqt = (Get-Command windeployqt.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $windeployqt) { $windeployqt = Join-Path $env:Qt6_DIR '..' '..' 'bin' 'windeployqt.exe' }
          New-Item -ItemType Directory -Force staging/gui-windows | Out-Null
          Copy-Item target/release/storey-gui.exe staging/gui-windows/
          & $windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --qmldir apps/gui/qml staging/gui-windows/storey-gui.exe
      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}
          path: |
            target/release/storey-gui
            staging/gui-windows/

  publish:
    needs: [cli, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/release-notes.sh CHANGELOG.md > /tmp/notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist-all
      - run: sh scripts/package-release.sh dist-all release
      - run: cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: /tmp/notes.md
