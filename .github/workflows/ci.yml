name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Rust components for lint
        run: |
          VER=$(mise current rust)
          rustup toolchain install "$VER" --profile minimal --component rustfmt,clippy
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "$HOME/.rustup/toolchains/$VER-$HOST/bin" >> "$GITHUB_PATH"
      - run: mise run lint:cli
      - run: mise run test:cli
      - run: mise run build:cli

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Rust components for lint
        run: |
          VER=$(mise current rust)
          rustup toolchain install "$VER" --profile minimal --component rustfmt,clippy
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "$HOME/.rustup/toolchains/$VER-$HOST/bin" >> "$GITHUB_PATH"
      - run: mise run lint:core
      - run: mise run test:core

  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Rust components for lint
        run: |
          VER=$(mise current rust)
          rustup toolchain install "$VER" --profile minimal --component rustfmt,clippy
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "$HOME/.rustup/toolchains/$VER-$HOST/bin" >> "$GITHUB_PATH"
      - run: mise run lint:meta
      - run: mise run test:meta

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Rust components for lint
        run: |
          VER=$(mise current rust)
          rustup toolchain install "$VER" --profile minimal --component rustfmt,clippy
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "$HOME/.rustup/toolchains/$VER-$HOST/bin" >> "$GITHUB_PATH"
      - run: mise run lint:ui
      - run: mise run test:ui

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      - name: Rust components for lint
        run: |
          VER=$(mise current rust)
          rustup toolchain install "$VER" --profile minimal --component rustfmt,clippy
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "$HOME/.rustup/toolchains/$VER-$HOST/bin" >> "$GITHUB_PATH"
      - run: mise run lint:gui
      - run: mise run test:gui
      - run: mise run build:gui
