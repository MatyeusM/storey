# Workspace root: all Rust crates build together with one lockfile.
# Per-crate tasks still address members directly:
# `cargo build --manifest-path apps/cli/Cargo.toml`.
[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
default-members = ["apps/cli", "apps/gui", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Shared by more than one member, plus our own crates (always here).
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storey-core = { path = "crates/core" }
storey-meta = { path = "crates/meta" }
storey-ui = { path = "crates/ui" }
