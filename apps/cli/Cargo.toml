[package]
name = "storey"
version = "0.1.0"
edition = "2024"
description = "Storey CAS CLI: thin argument parsing over core (see docs/CLI-CONTRACT.md)"
license = "MIT"

[[bin]]
name = "storey"
path = "src/main.rs"

[dependencies]
core = { path = "../../crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1" }
serde_json = "1"
signal-hook = "0.3"
