[package]
name = "storey"
version = "0.1.0"
edition = "2024"
description = "Storey CAS CLI: thin argument parsing over storey-core (see docs/CLI-CONTRACT.md)"
license = "MIT"

[[bin]]
name = "storey"
path = "src/main.rs"

[dependencies]
storey-core = { path = "../../crates/storey-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1" }
serde_json = "1"
