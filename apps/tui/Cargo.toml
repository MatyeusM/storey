[package]
name = "storey-tui"
version = "0.1.0"
edition = "2024"
description = "Ratatui terminal interface to the storey CLI (thin client, shells out to storey)"
license = "MIT"

[[bin]]
name = "storey-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
storey-shared = { path = "../shared" }
