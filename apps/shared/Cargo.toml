[package]
name = "storey-shared"
version = "0.1.0"
edition = "2024"
description = "Common UI layer for storey-tui and storey-gui: CLI subprocess driver, log parsing, index types, tag sources"
license = "MIT"

[lib]
name = "storey_shared"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
