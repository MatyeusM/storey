[package]
name = "storey-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qt6 graphical interface to the storey CLI (thin client, shells out to storey)"

[[bin]]
name = "storey-gui"
path = "src/main.rs"

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
clap.workspace = true
anyhow.workspace = true
storey-core.workspace = true
storey-ui.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
